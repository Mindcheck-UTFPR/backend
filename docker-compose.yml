services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mindcheck
      POSTGRES_USER: mindcheck
      POSTGRES_PASSWORD: mindcheck
    ports:
      - "5432:5432"
    volumes:
      - mindcheck_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindcheck -d mindcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  mindcheck_postgres_data:
