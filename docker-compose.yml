services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mindcheck
      POSTGRES_USER: mindcheck
      POSTGRES_PASSWORD: mindcheck
    ports:
      - "5432:5432"
    volumes:
      - mindcheck_postgres_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindcheck -d mindcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mindcheck-backend:0.1.0
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgresql://mindcheck:mindcheck@postgres:5432/mindcheck
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

volumes:
  mindcheck_postgres_data:
