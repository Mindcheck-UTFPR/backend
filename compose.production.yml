name: mindcheck-production

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindcheck
      POSTGRES_USER: mindcheck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina a senha no arquivo de ambiente da VM}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindcheck -d mindcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  api:
    build: .
    image: mindcheck-backend:${RELEASE_SHA:?Informe o commit da release}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:?Defina a origem HTTPS do frontend}
      DATABASE_URL: ${DATABASE_URL:?Defina a URL do PostgreSQL com host postgres}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *logging

volumes:
  postgres_data:
    name: mindcheck_production_postgres
