# CI — qualidade e testes (não publica)

name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

env:
  # Só para o Prisma Client e os testes; não é o banco nem o segredo de produção.
  NODE_ENV: test
  PORT: 3000
  CORS_ORIGIN: http://localhost:5173
  DATABASE_URL: postgresql://mindcheck:mindcheck@localhost:5432/mindcheck
  JWT_SEGREDO: segredo-de-teste-com-32-caracteres-ok
  JWT_ACCESS_SEGUNDOS: 900
  REFRESH_DIAS: 7
  TERMOS_VERSAO: "1.0"

jobs:
  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Executar testes automatizados (Vitest)
        run: pnpm test

  build:
    name: Build
    needs: [testes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Compilar TypeScript (prisma generate + tsc)
        run: pnpm build
