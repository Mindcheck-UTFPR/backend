# Troque mindcheck.example.com pelo dominio apontado para a VM.
# Instale em /etc/nginx/sites-available/mindcheck e habilite sites-enabled.
# Emita HTTPS com certbot --nginx antes de liberar a demonstracao.
server {
    listen 80;
    server_name mindcheck.example.com;
    root /opt/mindcheck/frontend/current;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        access_log off;
    }
}
